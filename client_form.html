<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Дані клієнта</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container my-5">
    <h2>Дані клієнта</h2>

    <form id="client-form">
      <div class="mb-3">
        <label class="form-label">Місто</label>
        <input type="text" class="form-control" id="city" required placeholder="Вінниця">
      </div>
      <div class="mb-3">
        <label class="form-label">Відділення Нової Пошти</label>
        <input type="text" class="form-control" id="np" required placeholder="25">
      </div>
      <div class="mb-3">
        <label class="form-label">Прізвище Ім'я</label>
        <input type="text" class="form-control" id="name" required placeholder="Серивко Маргарита">
      </div>
      <div class="mb-3">
        <label class="form-label">Телефон</label>
        <input type="text" class="form-control" id="phone" required placeholder="0674229641">
      </div>
      <button type="submit" class="btn btn-primary">Згенерувати чек</button>
    </form>

    <div class="mt-4 d-none" id="final-order-block">
      <h5>Фінальне замовлення:</h5>
      <pre id="final-order-summary" class="border p-3"></pre>
      <button id="save-to-sheet" class="btn btn-success">Зберегти в Google Таблицю</button>
    </div>
  </div>
<!--
  https://script.google.com/macros/s/AKfycbxFTR8vpTTwz-PjBshf05VbNG-OTZdOwZA-R2MN-lrVzSBdSrJDTeN9geM_HVlbYA8s/exec
-->
  <script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxFTR8vpTTwz-PjBshf05VbNG-OTZdOwZA-R2MN-lrVzSBdSrJDTeN9geM_HVlbYA8s/exec"; // встав сюди URL Apps Script

  document.getElementById("client-form").addEventListener("submit", function(event) {
    event.preventDefault();

    const city = document.getElementById("city").value.trim();
    const np = document.getElementById("np").value.trim();
    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();

    const order = localStorage.getItem("orderSummary") || "";
    let finalOrder = order;
    finalOrder += `\n${city}\nНова пошта ${np}\n${name}\n${phone}\n* * * * * * * * * * * * * *`;

    document.getElementById("final-order-summary").textContent = finalOrder;
    document.getElementById("final-order-block").classList.remove("d-none");

    localStorage.setItem("finalOrderSummary", finalOrder);
  });

  document.getElementById("save-to-sheet").addEventListener("click", function() {
    const finalOrder = localStorage.getItem("finalOrderSummary");

    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ order: finalOrder }),
      headers: { "Content-Type": "application/json" }
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === "success") {
        alert("Замовлення успішно збережене в таблиці!");
      } else {
        alert("Сталася помилка при збереженні.");
      }
    
    })
    .then(data => console.log(data))
    .catch(err => {
      console.error("Помилка:", err);
      alert("Не вдалося підключитися до сервера.");
    });
    
  });
</script>

</body>
</html>
