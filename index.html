<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Фільтр товарів (кнопки + гравіювання)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container my-5">
    <h2>Підбір товару</h2>

    <!-- Категорії -->
    <div id="category-block" class="mb-3"></div>

    <!-- Підкатегорії -->
    <div id="subcategory-block" class="mb-3 d-none"></div>

    <!-- Розміри -->
    <div id="size-block" class="mb-3 d-none"></div>

    <!-- Аксесуари -->
    <div class="mt-4 d-none" id="accessories-block">
      <h5>Аксесуари до розміру <span id="selected-size"></span>:</h5>
      <ul class="list-group" id="accessories-list"></ul>
    </div>

    <!-- Форма гравіювання -->
    <div class="mt-3 d-none" id="engraving-block">
      <label for="engraving-text" class="form-label">Опишіть гравіювання:</label>
      <textarea id="engraving-text" class="form-control" rows="2" placeholder="Ваш текст для гравіювання"></textarea>
    </div>

    <!-- Чек -->
    <div class="mt-4 d-none" id="order-block">
      <h5>Ваше замовлення:</h5>
      <pre id="order-summary" class="border p-3"></pre>
      <button id="submit-order" class="btn btn-success">Оформити замовлення</button>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
